<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoCampus — Event Photographer Management</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--border:#e2e0d8;
  --text:#1a1916;--muted:#7a7868;--accent:#2563eb;--accent-light:#eff4ff;
  --green:#16a34a;--green-light:#f0fdf4;--amber:#d97706;--amber-light:#fffbeb;
  --red:#dc2626;--red-light:#fef2f2;--purple:#7c3aed;--purple-light:#f5f3ff;
  --radius:10px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 12px rgba(0,0,0,.1);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;}
button{font-family:'DM Sans',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'DM Sans',sans-serif;}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:48px 40px;width:100%;max-width:420px;box-shadow:var(--shadow-md);}
.login-logo{font-size:22px;font-weight:600;margin-bottom:6px;letter-spacing:-0.5px;}
.login-logo span{color:var(--accent);}
.login-sub{color:var(--muted);font-size:13px;margin-bottom:32px;}
.login-label{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px;}
.login-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;color:var(--text);background:var(--surface);outline:none;transition:border-color .2s;}
.login-input:focus{border-color:var(--accent);}
.login-field{margin-bottom:16px;}
.login-btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:500;margin-top:8px;transition:opacity .2s;}
.login-btn:hover{opacity:.9;}
.login-error{background:#fef2f2;border:1px solid #fecaca;color:var(--red);padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:none;}

/* APP */
#appShell{display:none;height:100vh;overflow:hidden;}
.shell{display:flex;height:100%;}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-logo{padding:20px 20px 16px;font-size:16px;font-weight:600;letter-spacing:-0.3px;border-bottom:1px solid var(--border);}
.sidebar-logo span{color:var(--accent);}
.sidebar-user{padding:12px 16px;border-bottom:1px solid var(--border);}
.sidebar-user-name{font-size:13px;font-weight:500;}
.sidebar-user-role{font-size:11px;color:var(--muted);text-transform:capitalize;}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:2px;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:var(--accent-light);color:var(--accent);}
.sidebar-bottom{padding:12px 8px;border-top:1px solid var(--border);}
.logout-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;width:100%;background:none;border:none;transition:all .15s;}
.logout-btn:hover{background:var(--red-light);color:var(--red);}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-title{font-size:16px;font-weight:600;}
.notif-btn{position:relative;background:none;border:none;padding:6px;color:var(--muted);font-size:18px;border-radius:8px;cursor:pointer;}
.notif-btn:hover{background:var(--surface2);}
.notif-badge{position:absolute;top:2px;right:2px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--surface);display:none;}
.page-content{flex:1;padding:28px;}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow);}
.stat-label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.stat-value{font-size:26px;font-weight:600;letter-spacing:-1px;line-height:1;}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px;}

/* TABLE */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px;}
.table-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.table-title{font-size:14px;font-weight:600;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--surface2);border-bottom:1px solid var(--border);}
td{padding:11px 16px;border-bottom:1px solid var(--border);font-size:13px;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}
.empty-row td{text-align:center;color:var(--muted);padding:28px;}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:capitalize;}
.badge-pending{background:var(--amber-light);color:var(--amber);}
.badge-approved{background:var(--green-light);color:var(--green);}
.badge-rejected{background:var(--red-light);color:var(--red);}
.badge-completed{background:var(--purple-light);color:var(--purple);}
.badge-assigned{background:var(--accent-light);color:var(--accent);}
.badge-accepted{background:var(--green-light);color:var(--green);}
.badge-declined{background:var(--red-light);color:var(--red);}
.badge-high{background:var(--red-light);color:var(--red);}
.badge-urgent{background:#fff1f2;color:#e11d48;}
.badge-medium{background:var(--amber-light);color:var(--amber);}
.badge-low{background:var(--green-light);color:var(--green);}
.badge-coordinator{background:var(--accent-light);color:var(--accent);}
.badge-photographer{background:var(--green-light);color:var(--green);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;border:none;transition:all .15s;cursor:pointer;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-success{background:var(--green);color:#fff;}
.btn-success:hover{opacity:.9;}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{opacity:.9;}
.btn-amber{background:var(--amber);color:#fff;}
.btn-amber:hover{opacity:.9;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{background:var(--surface2);}
.btn-sm{padding:5px 12px;font-size:12px;}

/* FORM */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow);max-width:700px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group.full{grid-column:1/-1;}
.form-label{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.form-input{padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--accent);}
.form-actions{margin-top:20px;display:flex;gap:10px;}
.form-title{font-size:16px;font-weight:600;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:28px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md);}
.modal-title{font-size:16px;font-weight:600;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.modal-actions{margin-top:20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}

/* NOTIF PANEL */
.notif-panel{position:fixed;top:0;right:0;width:340px;height:100vh;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-md);z-index:500;transform:translateX(100%);transition:transform .25s;overflow-y:auto;}
.notif-panel.open{transform:translateX(0);}
.notif-panel-header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.notif-item{padding:14px 20px;border-bottom:1px solid var(--border);}
.notif-item.unread{background:var(--accent-light);}
.notif-item-title{font-size:13px;font-weight:500;margin-bottom:3px;}
.notif-item-msg{font-size:12px;color:var(--muted);}
.notif-item-time{font-size:11px;color:var(--muted);margin-top:4px;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:12px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:2000;transform:translateY(80px);opacity:0;transition:all .3s;max-width:320px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{background:var(--green);}
.toast.error{background:var(--red);}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--muted);font-size:13px;gap:10px;}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.text-muted{color:var(--muted);font-size:12px;}
.action-btns{display:flex;gap:6px;flex-wrap:wrap;}
.mb-3{margin-bottom:12px;}
.section-title{font-size:16px;font-weight:600;margin-bottom:16px;}

/* CALENDAR */
.calendar-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:20px;}
.calendar-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:50%;}
/* CUSTOM CALENDAR GRID */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-nav-title{font-size:15px;font-weight:600;}
.cal-nav-btns{display:flex;gap:6px;}
.cal-grid{width:100%;border-collapse:collapse;table-layout:fixed;}
.cal-grid th{padding:8px 4px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--surface2);border:1px solid var(--border);}
.cal-grid td{padding:6px 4px;vertical-align:top;border:1px solid var(--border);cursor:pointer;min-height:80px;position:relative;transition:background .15s;}
.cal-grid td:hover{background:#f0f4ff;}
.cal-grid td.today{background:#eff6ff;}
.cal-grid td.other-month{background:var(--surface2);opacity:.6;}
.cal-date-num{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px;padding:0 2px;}
.cal-date-num.today-num{background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;}
.cal-event-dot{display:block;margin:1px 2px;padding:2px 5px;border-radius:3px;font-size:10px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.cal-more{font-size:10px;color:var(--accent);padding:1px 4px;cursor:pointer;font-weight:500;}

/* CONFLICT ALERT */
.conflict-alert{background:#fff1f2;border:1px solid #fecdd3;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;font-size:13px;color:#be123c;}
.conflict-alert strong{display:block;margin-bottom:4px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Photo<span>Campus</span></div>
    <div class="login-sub">Event Photographer Management System</div>
    <div class="login-error" id="loginError"></div>
    <div class="login-field">
      <label class="login-label">Email</label>
      <input class="login-input" type="email" id="loginEmail" placeholder="your@email.com" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-field">
      <label class="login-label">Password</label>
      <input class="login-input" type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()" id="loginBtn">Sign In</button>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;">Default Admin</div>
      <div style="font-size:12px;color:var(--muted);">admin@campus.com / Admin@1234</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appShell">
  <div class="shell">
    <div class="sidebar">
      <div class="sidebar-logo">Photo<span>Campus</span></div>
      <div class="sidebar-user">
        <div class="sidebar-user-name" id="sidebarName">—</div>
        <div class="sidebar-user-role" id="sidebarRole">—</div>
      </div>
      <div class="sidebar-nav" id="sidebarNav"></div>
      <div class="sidebar-bottom">
        <button class="logout-btn" onclick="doLogout()">↩ Sign out</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <button class="notif-btn" onclick="toggleNotifPanel()">
          🔔<span class="notif-badge" id="notifBadge"></span>
        </button>
      </div>
      <div class="page-content" id="pageContent"></div>
    </div>
  </div>
</div>

<!-- NOTIF PANEL -->
<div class="notif-panel" id="notifPanel">
  <div class="notif-panel-header">
    <div style="font-size:15px;font-weight:600;">🔔 Notifications</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-ghost btn-sm" onclick="markAllRead()">Mark all read</button>
      <button id="notifCloseBtn" style="background:var(--surface2);border:1px solid var(--border);width:28px;height:28px;border-radius:6px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);">✕</button>
    </div>
  </div>
  <div id="notifList"><div class="loading">No notifications.</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbx9Kz6dzSBfpy-UmDbMe_yetZsfPUVTvZverGFoQBhskPbyzFF0EyUTtl4b0wKval5K/exec';
let currentUser = null;
let calendarInstance = null;

// ── API ───────────────────────────────────────────────────
async function api(params) {
  const url = API + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return await res.json();
}

// ── AUTH ──────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value.trim();
  const errEl = document.getElementById('loginError');
  const btn   = document.getElementById('loginBtn');
  errEl.style.display = 'none';
  if (!email || !pass) { errEl.textContent='Please enter email and password.'; errEl.style.display='block'; return; }
  btn.textContent = 'Signing in…'; btn.disabled = true;
  try {
    const res = await api({ action:'login', email, password:pass });
    if (res.error) { errEl.textContent = res.error; errEl.style.display='block'; }
    else { currentUser = res.user; localStorage.setItem('pc_user', JSON.stringify(res.user)); launchApp(); }
  } catch(e) { errEl.textContent = 'Connection error. Please try again.'; errEl.style.display='block'; }
  btn.textContent = 'Sign In'; btn.disabled = false;
}
function doLogout() {
  currentUser = null; localStorage.removeItem('pc_user');
  document.getElementById('appShell').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  if (calendarInstance) { calendarInstance.destroy(); calendarInstance = null; }
}
function launchApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'block';
  document.getElementById('sidebarName').textContent = currentUser.full_name;
  document.getElementById('sidebarRole').textContent = currentUser.role;
  // wire close button for notification panel
  document.getElementById('notifCloseBtn').addEventListener('click', function(){ 
    document.getElementById('notifPanel').classList.remove('open'); 
  });
  buildSidebar(); loadNotifications(); navigateTo('dashboard');
}

// ── SIDEBAR ───────────────────────────────────────────────
const NAV = {
  admin:[
    {id:'dashboard', icon:'📊',label:'Dashboard'},
    {id:'calendar',  icon:'📅',label:'Events Calendar'},
    {id:'requests',  icon:'📋',label:'All Requests'},
    {id:'assign',    icon:'📸',label:'Assign Photographers'},
    {id:'employees', icon:'👥',label:'Employees'},
    {id:'campuses',  icon:'🏛️',label:'Campuses'},
    {id:'reports',   icon:'📈',label:'Reports'},
  ],
  coordinator:[
    {id:'dashboard',   icon:'📊',label:'Dashboard'},
    {id:'new-request', icon:'➕',label:'New Request'},
    {id:'my-requests', icon:'📋',label:'My Requests'},
  ],
  photographer:[
    {id:'dashboard',  icon:'📊',label:'Dashboard'},
    {id:'assignments',icon:'📸',label:'My Assignments'},
    {id:'schedule',   icon:'📅',label:'My Schedule'},
  ],
};
function buildSidebar() {
  const items = NAV[currentUser.role]||[];
  document.getElementById('sidebarNav').innerHTML = items.map(n=>
    `<div class="nav-item" id="nav-${n.id}" onclick="navigateTo('${n.id}')">
      <span>${n.icon}</span>${n.label}</div>`).join('');
}
const PAGE_TITLES = {
  dashboard:'Dashboard',calendar:'Events Calendar',requests:'All Requests',
  assign:'Assign Photographers',employees:'Employees',campuses:'Campuses',reports:'Reports',
  'new-request':'New Event Request','my-requests':'My Requests',
  assignments:'My Assignments',schedule:'My Schedule'
};
function navigateTo(page) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el = document.getElementById('nav-'+page);
  if(el) el.classList.add('active');
  document.getElementById('topbarTitle').textContent = PAGE_TITLES[page]||page;
  if (calendarInstance && page !== 'calendar' && page !== 'dashboard') {
    calendarInstance.destroy(); calendarInstance = null;
  }
  renderPage(page);
}

// ── ROUTER ────────────────────────────────────────────────
async function renderPage(page) {
  const c = document.getElementById('pageContent');
  c.innerHTML = `<div class="loading"><div class="spinner"></div>Loading…</div>`;
  try {
    if (page==='dashboard')      await renderDashboard(c);
    else if (page==='calendar')  await renderCalendarPage(c);
    else if (page==='requests')  await renderRequests(c);
    else if (page==='assign')    await renderAssign(c);
    else if (page==='employees') await renderEmployees(c);
    else if (page==='campuses')  await renderCampuses(c);
    else if (page==='reports')   await renderReports(c);
    else if (page==='new-request')  await renderNewRequest(c);
    else if (page==='my-requests')  await renderMyRequests(c);
    else if (page==='assignments')  await renderAssignments(c);
    else if (page==='schedule')     await renderSchedule(c);
  } catch(e) { c.innerHTML=`<div class="loading">Error: ${e.message}</div>`; }
}

// ── DASHBOARD (ADMIN) ─────────────────────────────────────
async function renderDashboard(c) {
  if (currentUser.role==='admin') {
    const [rRes,uRes,campRes,aRes] = await Promise.all([
      api({action:'getRequests'}), api({action:'getUsers'}),
      api({action:'getCampuses'}), api({action:'getAssignments'}),
    ]);
    const reqs=rRes.data||[], users=uRes.data||[], assigns=aRes.data||[];
    const pending   = reqs.filter(r=>r.status==='pending').length;
    const approved  = reqs.filter(r=>r.status==='approved').length;
    const completed = reqs.filter(r=>r.status==='completed').length;
    const photographers = users.filter(u=>u.role==='photographer').length;
    // completed assignments by photographers
    const completedAssigns = assigns.filter(a=>a.status==='completed').length;
    // detect conflicts
    const conflicts = detectConflicts(reqs);

    c.innerHTML=`
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Pending Requests</div><div class="stat-value" style="color:var(--amber)">${pending}</div><div class="stat-sub">Awaiting review</div></div>
        <div class="stat-card"><div class="stat-label">Approved Events</div><div class="stat-value" style="color:var(--green)">${approved}</div></div>
        <div class="stat-card"><div class="stat-label">Completed Events</div><div class="stat-value" style="color:var(--purple)">${completed}</div><div class="stat-sub">Requests done</div></div>
        <div class="stat-card"><div class="stat-label">Tasks Completed</div><div class="stat-value" style="color:var(--green)">${completedAssigns}</div><div class="stat-sub">By photographers</div></div>
        <div class="stat-card"><div class="stat-label">Photographers</div><div class="stat-value" style="color:var(--accent)">${photographers}</div></div>
        <div class="stat-card"><div class="stat-label">Campuses</div><div class="stat-value">${(campRes.data||[]).length}</div></div>

// ── CONFLICT DETECTION ────────────────────────────────────
function detectConflicts(reqs) {
  const conflicts = [];
  const active = reqs.filter(r=>r.status==='pending'||r.status==='approved');
  for (let i=0; i<active.length; i++) {
    for (let j=i+1; j<active.length; j++) {
      const a=active[i], b=active[j];
      if (a.event_date !== b.event_date) continue;
      if (a.start_time < b.end_time && a.end_time > b.start_time) {
        conflicts.push({
          a: a.event_name, b: b.event_name,
          date: a.event_date,
          campus_a: a.campus_name||'Campus A',
          campus_b: b.campus_name||'Campus B',
          id_a: a.id, id_b: b.id,
          time_a: `${a.start_time}–${a.end_time}`,
          time_b: `${b.start_time}–${b.end_time}`,
        });
      }
    }
  }
  return conflicts;
}

// ── CALENDAR ──────────────────────────────────────────────
function statusColor(s){
  return s==='pending'?'#d97706':s==='approved'?'#16a34a':s==='completed'?'#7c3aed':s==='rejected'?'#dc2626':'#6b7280';
}

let _calState={year:new Date().getFullYear(),month:new Date().getMonth(),reqs:[],conflicts:[],conflictIds:new Set()};

function renderCustomCalendar(elId,reqs,conflicts){
  const cids=new Set();
  conflicts.forEach(function(c){cids.add(c.id_a);cids.add(c.id_b);});
  window._calReqs=reqs;
  window._calConflictIds=cids;
  _calState.reqs=reqs;_calState.conflicts=conflicts;_calState.conflictIds=cids;
  drawCalendar(elId);
}

function drawCalendar(elId){
  const el=document.getElementById(elId);
  if(!el)return;
  const {year,month,reqs,conflictIds}=_calState;
  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today=new Date();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const daysInPrev=new Date(year,month,0).getDate();

  // group reqs by date
  const byDate={};
  reqs.forEach(function(r){if(!r.event_date)return;if(!byDate[r.event_date])byDate[r.event_date]=[];byDate[r.event_date].push(r);});

  // nav bar
  let h='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">'
    +'<div style="font-size:15px;font-weight:600;">'+MONTHS[month]+' '+year+'</div>'
    +'<div style="display:flex;gap:6px;">'
    +'<button class="btn btn-ghost btn-sm" id="calPrev">◀ Prev</button>'
    +'<button class="btn btn-ghost btn-sm" id="calToday">Today</button>'
    +'<button class="btn btn-ghost btn-sm" id="calNext">Next ▶</button>'
    +'</div></div>';

  // header row
  h+='<table style="width:100%;border-collapse:collapse;table-layout:fixed;"><thead><tr>';
  DAYS.forEach(function(d){h+='<th style="padding:8px 4px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;background:var(--surface2);border:1px solid var(--border);">'+d+'</th>';});
  h+='</tr></thead><tbody>';

  let day=1,nextDay=1;
  for(let row=0;row<6;row++){
    if(day>daysInMonth)break;
    h+='<tr>';
    for(let col=0;col<7;col++){
      const idx=row*7+col;
      let dStr='',dispNum='',isOther=false,isToday2=false;
      if(idx<firstDay){
        const pd=daysInPrev-firstDay+idx+1;
        const pm=month===0?12:month;const py=month===0?year-1:year;
        dStr=py+'-'+String(pm).padStart(2,'0')+'-'+String(pd).padStart(2,'0');
        dispNum=pd;isOther=true;
      } else if(day>daysInMonth){
        const nm=month===11?1:month+2;const ny=month===11?year+1:year;
        dStr=ny+'-'+String(nm).padStart(2,'0')+'-'+String(nextDay).padStart(2,'0');
        dispNum=nextDay++;isOther=true;
      } else {
        dStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
        dispNum=day;
        isToday2=(day===today.getDate()&&month===today.getMonth()&&year===today.getFullYear());
        day++;
      }
      const dReqs=byDate[dStr]||[];
      const hasC=dReqs.some(function(r){return conflictIds&&conflictIds.has(r.id);});
      const tdStyle='padding:5px 3px;vertical-align:top;border:1px solid var(--border);cursor:pointer;min-height:76px;position:relative;'
        +(isOther?'background:var(--surface2);opacity:.55;':'')
        +(isToday2?'background:#eff6ff;':'')
        +(hasC?'outline:2px solid #dc2626;outline-offset:-2px;':'');
      const numStyle=isToday2
        ?'display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:var(--accent);color:#fff;border-radius:50%;font-size:11px;font-weight:700;margin-bottom:2px;'
        :'font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px;padding:0 2px;';

      h+='<td data-date="'+dStr+'" style="'+tdStyle+'">'
        +'<div style="'+numStyle+'">'+dispNum+'</div>';

      dReqs.slice(0,2).forEach(function(r){
        const bg=conflictIds&&conflictIds.has(r.id)?'#dc2626':statusColor(r.status);
        h+='<div data-date="'+dStr+'" style="background:'+bg+';color:#fff;border-radius:3px;font-size:10px;font-weight:600;padding:1px 4px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;" title="'+r.event_name+'">'+r.event_name+'</div>';
      });
      if(dReqs.length>2){
        h+='<div data-date="'+dStr+'" style="font-size:10px;color:var(--accent);padding:1px 2px;cursor:pointer;font-weight:500;">+'+(dReqs.length-2)+' more</div>';
      }
      h+='</td>';
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  el.innerHTML=h;

  // attach click events via delegation — NO inline onclick
  el.addEventListener('click',function(e){
    const cell=e.target.closest('[data-date]');
    if(cell){showDateModal(cell.getAttribute('data-date'));}
  });
  document.getElementById('calPrev')&&document.getElementById('calPrev').addEventListener('click',function(e){e.stopPropagation();calNav(-1,elId);});
  document.getElementById('calNext')&&document.getElementById('calNext').addEventListener('click',function(e){e.stopPropagation();calNav(1,elId);});
  document.getElementById('calToday')&&document.getElementById('calToday').addEventListener('click',function(e){e.stopPropagation();calNavToday(elId);});
}

function calNav(dir,elId){
  _calState.month+=dir;
  if(_calState.month>11){_calState.month=0;_calState.year++;}
  if(_calState.month<0){_calState.month=11;_calState.year--;}
  drawCalendar(elId);
}
function calNavToday(elId){
  _calState.month=new Date().getMonth();
  _calState.year=new Date().getFullYear();
  drawCalendar(elId);
}

async function dateModalAction(id,status,requestedBy,eventName){

  const res=await api({action:'updateRequest',id,status});
  if(res.error){showToast('Error: '+res.error,'error');return;}
  if(requestedBy)await api({action:'addNotification',user_id:requestedBy,title:'Request '+status,message:'Your request "'+eventName+'" has been '+status+' by admin.'});
  showToast('Request '+status,'success');
  const calActive=document.getElementById('nav-calendar')&&document.getElementById('nav-calendar').classList.contains('active');
  await renderPage(calActive?'calendar':'dashboard');
}

async function calAction(id,status,requestedBy,eventName){
  var ex=document.getElementById('eventModal');if(ex)ex.remove();
  const res=await api({action:'updateRequest',id,status});
  if(res.error){showToast('Error: '+res.error,'error');return;}
  if(requestedBy)await api({action:'addNotification',user_id:requestedBy,title:'Request '+status,message:'Your request "'+eventName+'" has been '+status+' by admin.'});
  showToast('Request '+status,'success');
  await renderPage('dashboard');
}

async function renderCalendarPage(c) {
  const {data:reqs=[]} = await api({action:'getRequests'});
  const conflicts = detectConflicts(reqs);
  c.innerHTML=`
    ${conflicts.length?`<div class="conflict-alert">

// ── REQUESTS ──────────────────────────────────────────────
function buildRequestTable(rows, showActions) {
  if (!rows.length) return `<table><tr class="empty-row"><td colspan="7">No requests found.</td></tr></table>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>Event</th><th>Campus</th><th>Date</th><th>Priority</th><th>Status</th><th>Requested By</th>${showActions?'<th>Actions</th>':''}</tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td><div style="font-weight:500">${r.event_name}</div><div class="text-muted">${r.event_type||''}</div></td>
      <td>${r.campus_name||'—'}</td>
      <td>${r.event_date}<div class="text-muted">${r.start_time||''}–${r.end_time||''}</div></td>
      <td><span class="badge badge-${r.priority||'medium'}">${r.priority||'medium'}</span></td>
      <td><span class="badge badge-${r.status}">${r.status}</span></td>
      <td>${r.requester_name||'—'}</td>
      ${showActions?`<td><div class="action-btns">${r.status==='pending'?`
        <button class="btn btn-success btn-sm" onclick="updateReqStatus('${r.id}','approved','${r.requested_by||''}','${r.event_name.replace(/'/g,"\\'")}')">Approve</button>
        <button class="btn btn-danger btn-sm" onclick="updateReqStatus('${r.id}','rejected','${r.requested_by||''}','${r.event_name.replace(/'/g,"\\'")}')">Reject</button>
      `:'<span class="text-muted">—</span>'}</div></td>`:''}
    </tr>`).join('')}</tbody></table></div>`;
}
async function renderRequests(c) {
  const {data:reqs=[]} = await api({action:'getRequests'});
  const conflicts = detectConflicts(reqs);
  window._allReqs = reqs;
  c.innerHTML=`
    ${conflicts.length?`<div class="conflict-alert">
      <strong>⚠️ ${conflicts.length} conflict${conflicts.length>1?'s':''} found</strong>
      ${conflicts.map(cf=>`• "${cf.a}" and "${cf.b}" overlap on ${cf.date}`).join('<br>')}
    </div>`:''}
    <div class="table-card">
      <div class="table-header"><div class="table-title">All Requests (${reqs.length})</div>
        <select class="form-input" style="padding:6px 10px;font-size:12px;" onchange="filterReqs(this.value)">
          <option value="">All Status</option>
          <option value="pending">Pending</option><option value="approved">Approved</option>
          <option value="rejected">Rejected</option><option value="completed">Completed</option>
        </select>
      </div>
      <div id="reqWrap">${buildRequestTable(reqs, true)}</div>
    </div>`;
}
function filterReqs(status) {
  const filtered = status ? window._allReqs.filter(r=>r.status===status) : window._allReqs;
  document.getElementById('reqWrap').innerHTML = buildRequestTable(filtered, true);
}
async function updateReqStatus(id, status, requestedBy, eventName) {
  const res = await api({action:'updateRequest', id, status});
  if (res.error) { showToast('Error: '+res.error,'error'); return; }
  showToast(`Request ${status}`,'success');
  if (requestedBy) await api({action:'addNotification', user_id:requestedBy, title:`Request ${status}`, message:`Your request "${eventName}" has been ${status} by admin.`});
  await renderRequests(document.getElementById('pageContent'));
}

  c.innerHTML=`<div class="section-title">Upcoming Schedule</div>
    ${upcoming.length?upcoming.map(a=>`
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:12px;display:flex;gap:20px;align-items:center;">
        <div style="background:var(--accent-light);color:var(--accent);border-radius:var(--radius);padding:12px 16px;text-align:center;min-width:64px;flex-shrink:0;">
          <div style="font-size:20px;font-weight:700;line-height:1;">${new Date(a.event_date+'T00:00:00').getDate()}</div>
          <div style="font-size:11px;font-weight:500;">${new Date(a.event_date+'T00:00:00').toLocaleString('default',{month:'short'})}</div>
        </div>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:15px;">${a.event_name}</div>
          <div class="text-muted">${a.campus_name||''} · ${a.venue||''}</div>
          <div class="text-muted">${a.start_time||''} – ${a.end_time||''}</div>
        </div>
        <span class="badge badge-${a.status}">${a.status}</span>
      </div>`).join('')
    :'<div class="loading">No upcoming assignments.</div>'}`;
}

// ── NOTIFICATIONS ─────────────────────────────────────────
async function loadNotifications() {
  const {data:notifs=[]} = await api({action:'getNotifications', user_id:currentUser.id});
  const unread=notifs.filter(n=>String(n.is_read).toUpperCase()!=='TRUE').length;
  document.getElementById('notifBadge').style.display=unread?'block':'none';
  document.getElementById('notifList').innerHTML=notifs.length?notifs.map(n=>`
    <div class="notif-item ${String(n.is_read).toUpperCase()!=='TRUE'?'unread':''}">
      <div class="notif-item-title">${n.title}</div>
      <div class="notif-item-msg">${n.message}</div>
      <div class="notif-item-time">${n.created_at||''}</div>
    </div>`).join(''):'<div class="loading">No notifications.</div>';
}
async function markAllRead() {
  await api({action:'markAllRead',user_id:currentUser.id});
  showToast('All marked as read','success'); loadNotifications();
}
function toggleNotifPanel() {
  document.getElementById('notifPanel').classList.toggle('open');
  loadNotifications();
}

// ── TOAST ─────────────────────────────────────────────────
function showToast(msg,type='') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(type?' '+type:'');
  setTimeout(()=>t.className='toast',3200);
}

// ── INIT ──────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  const saved=localStorage.getItem('pc_user');
  if(saved){try{currentUser=JSON.parse(saved);launchApp();}catch(e){localStorage.removeItem('pc_user');}}
});
</script>
</body>
</html>
